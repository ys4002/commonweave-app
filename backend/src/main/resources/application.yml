spring:
  application:
    name: commonweave
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/commonweave?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration/mysql}
  jackson:
    time-zone: UTC
    default-property-inclusion: always
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: 8080
  servlet:
    session:
      timeout: 8h
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
        secure: ${app.security.secure-cookies}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

app:
  timezone: Asia/Kolkata
  security:
    # Secure cookies unless profile dev (plain http on localhost). Override with APP_COOKIE_SECURE.
    secure-cookies: ${APP_COOKIE_SECURE:true}
    login-max-failures: 5
    throttle-window: 15m
    signup-max-attempts: 10
  scheduling:
    enabled: true
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  impact:
    loan-share: 0.20
    gift-share: 0.60
    service-co2-share: 0.10
    hourly-rate-inr: 250
    default-co2-kg: 1
    co2-kg-by-category:
      TOOLS: 6
      ELECTRONICS: 15
      FURNITURE: 8
      KITCHEN: 3
      GARDEN: 2
      BOOKS: 1
      KIDS: 4
      SPORTS_CYCLES: 7
